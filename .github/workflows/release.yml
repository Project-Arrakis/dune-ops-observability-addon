name: Release addon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history required for the ancestor guard below --
          # git merge-base --is-ancestor cannot answer "is this tag's
          # commit reachable from main" from a shallow checkout.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Refuse to release a tag whose commit is not an ancestor of main
        # Prevents a repeat of S-3 (docs/security/SECURITY-ARCHITECTURE-GAP-ANALYSIS.md):
        # git tag vX.Y.Z && git push --tags succeeding even when the
        # tagged commit was never merged into main, producing a
        # published release that doesn't correspond to any real point
        # in the project's actual history.
        run: |
          set -euo pipefail
          # Do not rely on actions/checkout's default fetch behavior
          # having already populated an up-to-date origin/main ref in
          # this tag-triggered context (its exact ref-fetching
          # behavior on a tag push is not something to assume) --
          # fetch it explicitly so this check has a real, current
          # target to compare against.
          git fetch origin main
          # On a tag push, the checked-out ref IS the tag's commit
          # (detached HEAD) -- GITHUB_SHA is exactly the commit being
          # tagged, which is the correct thing to check.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Refusing to release: tagged commit $GITHUB_SHA is not an ancestor of main."
            echo "::error::This is exactly the defect that produced the fabricated v0.5.0-v1.0.0 releases -- see S-3 in docs/SECURITY-ARCHITECTURE-GAP-ANALYSIS.md."
            exit 1
          fi
          echo "OK: $GITHUB_SHA is an ancestor of main -- proceeding with release."
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Validate addon
        run: node scripts/validate.js
      - name: Check tag matches addon version
        run: |
          ADDON_VERSION="$(node -e "process.stdout.write(require('./addon.json').version)")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$ADDON_VERSION" != "$TAG_VERSION" ]; then
            echo "addon.json version must match tag version"
            exit 1
          fi
      - name: Package addon
        run: bash scripts/package.sh
      - name: Generate SBOM
        run: |
          npm install --ignore-scripts || true
          npx @cyclonedx/cyclonedx-npm --output-file dist/sbom.json --output-format json 2>/dev/null || echo "SBOM generation skipped (no package.json or cyclonedx unavailable)"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ADDON_NAME="$(node -e "process.stdout.write(require('./addon.json').name)")"
          ADDON_VERSION="$(node -e "process.stdout.write(require('./addon.json').version)")"
          PACKAGE_PATH="$(find dist -maxdepth 1 -type f -name '*.zip' | sort | head -n 1)"
          CHECKSUM_PATH="${PACKAGE_PATH}.sha256"
          SBOM_PATH="dist/sbom.json"
          RELEASE_ARGS="$PACKAGE_PATH $CHECKSUM_PATH"
          if [ -f "$SBOM_PATH" ]; then
            RELEASE_ARGS="$RELEASE_ARGS $SBOM_PATH"
          fi
          gh release create "$GITHUB_REF_NAME" $RELEASE_ARGS --title "$ADDON_NAME v$ADDON_VERSION" --notes "Addon package, SHA-256 checksum, and CycloneDX SBOM."
