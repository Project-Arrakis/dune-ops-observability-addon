name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  shellcheck:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=warning $(find . -name "*.sh" -not -path "./node_modules/*" -not -path "./.git/*")

  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate JSON files
        run: |
          find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" -exec python3 -c "import json,sys; json.load(open(sys.argv[1]))" {} \; || { echo "Invalid JSON found"; exit 1; }
          echo "All JSON files valid"

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts || true
      - run: npm audit --audit-level=moderate

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history required: check-version-consistency.js's
          # ancestor-aware "latest real release" lookup (via
          # governance-lib.js's findLatestRealReleaseTag) needs
          # `git merge-base --is-ancestor` against origin/main and
          # every release tag, which a shallow checkout can't answer.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/validate.js
      - run: node scripts/check-bridge-action-drift.js
      - run: node scripts/check-version-consistency.js
      - run: node scripts/check-sri-integrity.js
      - run: npm test

  # A "security" job (gitleaks + semgrep + trivy) used to live here.
  # Removed -- it duplicated secret-scan.yml/sast.yml/filesystem-scan.yml
  # exactly (same tools, same config), which already run those same three
  # scanners as their own required branch-protection checks ("gitleaks",
  # "semgrep", "trivy"). Five separate workflow files independently
  # running the same scanners was wasted CI time and a real drift risk
  # (one copy's config silently diverging from another's) -- found during
  # an org-wide CI audit. This job was never itself a required check, so
  # removing it doesn't change what's enforced.

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [shellcheck, validate-json, npm-audit, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          SHELLCHECK: ${{ needs.shellcheck.result }}
          JSON: ${{ needs.validate-json.result }}
          NPM_AUDIT: ${{ needs.npm-audit.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
        run: |
          set -euo pipefail
          failed=0
          for result in "$SHELLCHECK" "$JSON" "$NPM_AUDIT" "$UNIT_TESTS"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more required checks did not passed."
            exit 1
          fi
          echo "All required checks passed."
