name: Security Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts || true
      - run: npm audit --audit-level=moderate

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # semgrep-sast/secret-scan/trivy-filesystem jobs used to live here.
  # Removed -- they duplicated sast.yml/secret-scan.yml/filesystem-scan.yml
  # exactly (same tools, same config), which already run as required
  # branch-protection checks ("semgrep", "gitleaks", "trivy"). None of
  # these three were themselves required checks, so removing them doesn't
  # change what's enforced. See ci.yml's matching removal for the same
  # reasoning.
