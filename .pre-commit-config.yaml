repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Several docs intentionally use the standard Markdown
        # hard-break convention (two trailing spaces to force a <br>,
        # e.g. docs/design/metrics-l1-design-audit-2026-08-08.md).
        # Without this arg, the hook strips those spaces and reports
        # "files were modified" -> non-zero exit -> a permanently red
        # required check on every push, regardless of what a given
        # commit actually changed (issue #123).
        args: ["--markdown-linebreak-ext=md"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Note: a local `ggshield` hook is intentionally not configured here.
      # GitGuardian secret scanning for this repository runs via the
      # GitGuardian GitHub App integration ("GitGuardian Security Checks",
      # visible on every PR), which requires no repository secret. The
      # `ggshield` CLI itself requires a GITGUARDIAN_API_KEY to
      # authenticate; no such secret is configured for this repo
      # (`gh secret list` returns empty), so a local CLI-based hook would
      # fail with "Invalid GitGuardian API key" in CI rather than
      # providing additional coverage. If a GITGUARDIAN_API_KEY secret is
      # ever provisioned, this hook can be reintroduced with
      # `env: {GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}}`
      # wired through the calling workflow.
      - id: trivy
        name: trivy
        entry: trivy fs --scanners secret --severity HIGH,CRITICAL .
        language: system
        pass_filenames: false
        always_run: true
        verbose: false

      - id: semgrep
        name: semgrep
        # Deliberately NOT pass_filenames: false / always_run: true (unlike
        # the trivy hook above, which is a whole-filesystem secret scanner
        # by design). Those two settings together meant semgrep received
        # no file arguments on every commit and fell back to scanning all
        # 286 tracked files regardless of what was staged -- confirmed via
        # direct timing: ~2-3 minutes full-repo vs. ~15s scoped to one
        # staged file. Letting pre-commit's default pass_filenames: true
        # pass only the staged files restores the fast local-commit tier
        # (full-ruleset, Supply-Chain-aware coverage now runs in CI via
        # .github/workflows/semgrep.yml on every PR/push/schedule instead).
        #
        # The `exclude` key below (pre-commit's own file-list filter,
        # applied BEFORE files are ever passed to semgrep) is required
        # despite .semgrepignore already listing these three files.
        # Confirmed via direct testing: semgrep's own --exclude flag and
        # .semgrepignore are BOTH silently ineffective once a file is also
        # given as an explicit positional argument (which pre-commit
        # always does, and which CI's `pre-commit run --all-files` does
        # for every tracked file) -- only filtering the file list before
        # it reaches semgrep's argv actually works. Without this, each of
        # these files' already-reviewed/accepted findings (real code, not
        # false positives, but explicitly out of scope per
        # .semgrepignore's own stated rationale for each) blocks every
        # commit/CI run that touches any file, not just these three.
        # Keep this pattern in sync with .semgrepignore's file list --
        # confirmed identical as of this commit (2 dev-tools scraper
        # files + 1 intentional-security-test-pattern fixture).
        entry: semgrep --error --config p/default
        language: system
        exclude: ^(ops-observability/dev-tools/(scrape-augments|scrape-placeables)\.js|tools/cross-repo-security-tests/blueprints-security\.test\.js)$
        verbose: false

      - id: validate-addon-manifest
        name: Validate addon manifest
        entry: node scripts/validate.js
        language: system
        pass_filenames: false
        files: ^(addon\.json|scripts/validate\.js)$

      - id: bridge-drift
        name: Bridge-action drift check
        entry: node scripts/check-bridge-action-drift.js
        language: system
        pass_filenames: false
        files: ^(web/data-providers\.js|README\.md)$

      - id: sri-integrity
        name: SRI integrity check (web/index.html vs. real script content)
        entry: node scripts/check-sri-integrity.js
        language: system
        pass_filenames: false
        files: ^(web/index\.html|web/addon\.js|web/data-providers\.js|web/faction-tagger\.js|web/dune-addon-bridge\.js|web/addon\.css)$

      - id: unit-tests
        name: Unit tests (node --test)
        entry: npm test
        language: system
        pass_filenames: false
        files: ^(web/|test/|package(-lock)?\.json)
