[extend]
# useDefault will extend the default configuration with the values in this file
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
  '''ops-observability/dev-tools/\.placeable-cache/.*''',
  '''ops-observability/dev-tools/\.augment-cache/.*''',
  '''.gitleaksignore''',
  '''.gitleaks.toml''',
  '''ops-observability/evidence/.*''',
  '''docs/diagrams/.*'''
]
regexes = [
  '''dune-idem-[0-9a-f-]+''',
  '''0x[0-9a-fA-F]{40}'''
]

# Per-rule allowlists: scope broad regex patterns to specific paths
# to avoid globally suppressing real credential leaks.
[[rules]]
id = "github-oauth"
[rules.allowlist]
paths = [
  '''ops-observability/dev-tools/\.placeable-cache/.*''',
  '''ops-observability/dev-tools/\.augment-cache/.*''',
]
